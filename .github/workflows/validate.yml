# CI validates TypeScript, lint rules and a production Next.js build.
# Keep the production-readiness feature branch in the push matrix.
name: Operations app checks

on:
  push:
    branches:
      - main
      - feature/operations-platform-foundation
      - feature/production-readiness-model-colour
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

# Revalidate after lint rule compatibility and schema updates.
